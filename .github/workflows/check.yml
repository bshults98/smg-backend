name: smg-check

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID from the checker frontend'
        required: true
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install WireGuard (if missing)
        run: |
          if command -v wg >/dev/null 2>&1; then
            echo "wireguard-tools already installed"
          else
            for i in 1 2 3; do
              sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools && break
              echo "apt attempt $i failed, retrying in 10s..."
              sleep 10
            done
          fi
          wg --version

      - name: Connect US tunnel
        run: |
          sudo bash -c 'cat > /etc/wireguard/wgusa.conf <<EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 10.2.0.2/32
          DNS = 1.1.1.1
          [Peer]
          PublicKey = ${{ vars.WG_PUBLIC_KEY }}
          AllowedIPs = 0.0.0.0/0
          Endpoint = ${{ vars.WG_ENDPOINT }}
          PersistentKeepalive = 25
          EOF'
          sudo wg-quick up wgusa || echo "TUNNEL_FAILED"

      - name: Verify egress IP
        run: |
          echo "Egress IP:"
          curl -s --max-time 10 https://ipwho.is/ | grep -E '"ip"|"country"|"city"' || echo "ipwho.is unreachable (tunnel may be flaky, continuing anyway)"

      - name: Probe SMG API
        run: |
          echo "Probing SMG endpoint (expect 400/403/415 on unauthenticated POST, not a hang):"
          curl -sv --max-time 15 -X POST "https://vista.studiomoviegrill.com/WSVistaWebClient/gift-cards/check-balance" \
            -H "content-type: application/json; charset=utf-8" \
            -H "user-agent: okhttp/4.11.0" \
            -d '{"cardNumber":"5896294206000089320"}' 2>&1 | tail -20 || echo "PROBE_FAILED"

      - name: Run checker
        env:
          SMG_HMAC_SECRET: ${{ secrets.SMG_HMAC_SECRET }}
          SMG_CONNECT_API_TOKEN: ${{ secrets.SMG_CONNECT_API_TOKEN }}
          RESULT_TOKEN: ${{ secrets.RESULT_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: node check.mjs
